apiVersion: apps/v1
kind: Deployment
metadata:
  name: tread-deployment
  labels:
    app: tread
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tread
  template:
    metadata:
      labels:
        app: tread
    spec:
      containers:
        - name: tread
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
